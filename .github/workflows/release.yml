name: Release
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-please:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    releases-matrix:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                goos: [linux, windows, darwin]
                goarch: [amd64, arm64]
                exclude:
                    - goarch: arm64
                      goos: windows

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.23.x"
                  check-latest: true
            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  VERSION: ${{ needs.release-please.outputs.tag_name }}
              run: |
                  go build -ldflags "-X github.com/chunkifydev/cli/pkg/version.Version=${VERSION}" -o chunkify .
                  tar -czf "chunkify_${GOOS}_${GOARCH}.tar.gz" chunkify
            - name: Upload
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  VERSION: ${{ needs.release-please.outputs.tag_name }}
                  ASSET: chunkify_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
              run: gh release upload "$VERSION" "$ASSET" --clobber
